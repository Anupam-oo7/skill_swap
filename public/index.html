<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Skill Swap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <!-- Two overlapping circles: one skill taught (teal), one learned (amber) -->
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="15" cy="20" r="11" fill="#7fd6cf" />
          <circle cx="25" cy="20" r="11" fill="#f2a93b" fill-opacity=".9" />
        </svg>
        <span>Skill Swap</span>
      </div>
      <div id="who"></div>
    </header>

    <main id="app"></main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
